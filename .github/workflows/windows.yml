# 发布 Release 后，在 GitHub 托管的 Windows 机器上构建 exe（带产品名/版本元数据），
# 再传到这个 Release（覆盖本地交叉编译、元数据是 Bun 默认值的版本）。
name: windows
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: build
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}.0" # v0.1.0 -> 0.1.0.0（Windows 版本号要 4 段）
          bun build steamplg.js --compile --minify --target=bun-windows-x64 \
            --windows-title=steamplg --windows-version="$V" \
            --windows-description="Steam 商店史低标记" --windows-publisher=AquaHydro \
            --outfile dist/steamplg-windows-x64.exe

      - name: upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/steamplg-windows-x64.exe --clobber
